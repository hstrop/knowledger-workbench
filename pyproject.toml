[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "knowledger-workbench"
version = "0.1.0"
description = "KnowLedger 企业知识库 RAG 工作台：可离线运行的解析、混合检索与证据问答示例"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "KnowLedger Contributors" }]
keywords = ["rag", "knowledge-base", "fastapi", "bm25", "milvus"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.9,<1",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
documents = [
  "pypdf>=5,<7",
]
online = [
  "dashscope>=1.20,<2",
  "langchain>=0.3,<2",
  "langchain-community>=0.3,<2",
]
milvus = [
  "pymilvus>=2.4,<3",
]
ocr = [
  "httpx>=0.27,<1",
]
dev = [
  "pytest>=8.3,<9",
  "httpx>=0.27,<1",
  "ruff>=0.8,<1",
]
all = [
  "pypdf>=5,<7",
  "dashscope>=1.20,<2",
  "langchain>=0.3,<2",
  "langchain-community>=0.3,<2",
  "pymilvus>=2.4,<3",
  "httpx>=0.27,<1",
]

[project.scripts]
knowledger = "knowledger.cli:main"
knowledger-api = "knowledger.api:run"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledger"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
